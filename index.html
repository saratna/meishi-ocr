<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>名刺OCR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
      color: #e94560;
    }
    .app-ver {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 16px;
    }
    .camera-area {
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
    }
    #video {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #000;
      min-height: 220px;
      object-fit: cover;
    }
    #canvas { display: none; }
    .preview-img {
      width: 100%;
      border-radius: 12px;
      display: none;
      margin-bottom: 10px;
      background: #0d1526;
      min-height: 80px;
      object-fit: contain;
    }
    .preview-pair {
      display: none;
      gap: 8px;
      width: 100%;
      max-width: 400px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .preview-pair.show { display: flex; }
    .preview-pair > div { flex: 1; min-width: 0; }
    .preview-pair .preview-img { margin-bottom: 0; }
    .preview-side-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }
    .capture-hint {
      width: 100%;
      max-width: 400px;
      text-align: center;
      font-size: 0.85rem;
      color: #e6a817;
      margin-bottom: 8px;
      display: none;
    }
    .capture-hint.show { display: block; }
    .error-banner {
      width: 100%;
      max-width: 400px;
      display: none;
      background: #4a1520;
      color: #ffd0d6;
      border: 1px solid #e94560;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .error-banner.show { display: block; }
    .btn-rotate { background: #2a3f5f; color: #e0e0e0; }
    .btn-rotate:hover { background: #35507a; }
    .rotate-tools,
    .crop-tools,
    .action-tools {
      width: 100%;
      max-width: 400px;
      display: none;
      gap: 8px;
      margin-bottom: 10px;
    }
    .rotate-tools.show,
    .crop-tools.show { display: flex; flex-wrap: wrap; }
    .action-tools.show { display: flex; flex-direction: column; }
    .rotate-tools .btn,
    .crop-tools .btn,
    .action-tools .btn {
      flex: 1 1 45%;
      margin-bottom: 0;
      padding: 14px 8px;
      font-size: 0.95rem;
      display: block !important;
    }
    .action-tools .btn { flex: 1 1 auto; }
    .action-tools .btn.is-hidden { display: none !important; }
    .btn-crop { background: #1f6f8b; color: #fff; }
    .btn-crop:hover { background: #185a70; }
    .btn-autocrop { background: #0f766e; color: #fff; flex: 1 1 100% !important; }
    .btn-autocrop:hover { background: #0b5f59; }

    .crop-editor {
      display: none !important;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(10, 12, 20, 0.96);
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow: auto;
      pointer-events: none;
    }
    .crop-editor.show {
      display: flex !important;
      pointer-events: auto;
    }
    .crop-editor h2 {
      color: #e94560;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }
    .crop-editor .crop-help {
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.4;
      max-width: 420px;
    }
    .crop-stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      touch-action: none;
      user-select: none;
    }
    .crop-stage canvas {
      width: 100%;
      height: auto;
      display: block !important;
      border-radius: 8px;
      background: #000;
    }
    .crop-actions {
      width: 100%;
      max-width: 420px;
      margin-top: 12px;
    }
    .crop-actions .btn { display: block; }
    .btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:disabled { opacity: 0.7; }
    .btn-capture { background: #e94560; color: white; }
    .btn-capture:hover { background: #c81e45; }
    .btn-file {
      background: transparent;
      color: #6cb6ff;
      max-width: 400px;
      padding: 6px;
      font-size: 0.9rem;
      font-weight: normal;
      margin-top: -4px;
    }
    .btn-back { background: #e6a817; color: #1a1a2e; }
    .btn-back:hover { background: #c9920f; }
    .btn-scan { background: #0f3460; color: white; }
    .btn-scan:hover { background: #16213e; }
    .btn-save { background: #2ecc71; color: white; }
    .btn-save:hover { background: #27ae60; }
    #btnSave { display: none; }
    #btnSave.show { display: block; }
    .btn-retry { background: #533483; color: white; }
    .btn-retry:hover { background: #3d2066; }
    .capture-label {
      width: 100%;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .search-card-detail a { color: #e94560; }
    .edit-form {
      width: 100%;
      max-width: 400px;
      display: none;
      margin-top: 10px;
    }
    .edit-form.show { display: block; }
    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #e94560;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #16213e;
      color: #e0e0e0;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #e94560;
    }
    .loading {
      text-align: center;
      color: #e94560;
      font-weight: bold;
      display: none;
      margin: 8px 0 12px;
    }
    .loading.show { display: block; }
    .status {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #16213e;
      display: none;
      text-align: center;
    }
    .status.show { display: block; }
    .status h3 { color: #2ecc71; margin-bottom: 8px; }
    .search-area {
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .search-area input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #16213e;
      color: #e0e0e0;
      font-size: 1rem;
    }
    .search-area input:focus {
      outline: none;
      border-color: #e94560;
    }
    .search-results {
      width: 100%;
      max-width: 400px;
      display: none;
      margin-bottom: 20px;
    }
    .search-results.show { display: block; }
    .search-card {
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border-left: 3px solid #e94560;
    }
    .search-card-name { font-weight: bold; font-size: 1.05rem; color: #e0e0e0; }
    .search-card-company { font-size: 0.9rem; color: #888; }
    .search-card-detail { font-size: 0.85rem; color: #666; margin-top: 4px; }
    .tabs {
      display: flex;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #16213e;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      touch-action: manipulation;
    }
    .tab.active { background: #e94560; color: white; }
    .tab-content { display: none; width: 100%; max-width: 400px; }
    .tab-content.active { display: flex; flex-direction: column; align-items: center; }
    #filePicker, #cameraCapture { display: none; }
  </style>
</head>
<body>
  <h1>名刺OCR</h1>
  <p class="app-ver">v20260920b</p>

  <div class="tabs">
    <button class="tab active" type="button" data-tab="scan">スキャン</button>
    <button class="tab" type="button" data-tab="search">検索</button>
  </div>

  <div id="tab-scan" class="tab-content active">
    <div class="capture-label" id="captureLabel">表面を撮影</div>
    <div class="capture-hint" id="captureHint">表は撮影済み。裏面を写して撮影してください</div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="camera-area">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <button id="btnCapture" class="btn btn-capture" type="button" onclick="window.takeMeishiPhoto && window.takeMeishiPhoto(event)">表面を撮影する</button>
    <button id="btnPickFile" class="btn btn-file" type="button">アルバムから選ぶ</button>
    <input id="cameraCapture" type="file" accept="image/*" capture="environment">
    <input id="filePicker" type="file" accept="image/*">

    <div class="preview-pair" id="previewPair">
      <div>
        <div class="preview-side-label">表</div>
        <img id="previewFront" class="preview-img" alt="名刺・表">
      </div>
      <div id="previewBackWrap" hidden>
        <div class="preview-side-label">裏</div>
        <img id="previewBack" class="preview-img" alt="名刺・裏">
      </div>
    </div>

    <div class="rotate-tools" id="rotateTools">
      <button id="btnRotateLeft" class="btn btn-rotate" type="button">左に90°</button>
      <button id="btnRotateRight" class="btn btn-rotate" type="button">右に90°</button>
    </div>
    <div class="crop-tools" id="cropTools">
      <button id="btnAutoCrop" class="btn btn-autocrop" type="button">自動で真四角</button>
      <button id="btnCropSquare" class="btn btn-crop" type="button">正方形で切る</button>
      <button id="btnCropQuad" class="btn btn-crop" type="button">4点で切る</button>
    </div>
    <div class="action-tools" id="actionTools">
      <button id="btnCaptureBack" class="btn btn-back" type="button">裏面も撮る</button>
      <button id="btnScan" class="btn btn-scan" type="button">読み取り開始</button>
      <button id="btnRetry" class="btn btn-retry" type="button">撮り直す</button>
    </div>

    <div id="loading" class="loading">処理中...名刺を読み取っています</div>

    <div id="editForm" class="edit-form">
      <div class="form-group"><label>氏名</label><input type="text" id="edit-name"></div>
      <div class="form-group"><label>ふりがな</label><input type="text" id="edit-furigana"></div>
      <div class="form-group"><label>会社名</label><input type="text" id="edit-company"></div>
      <div class="form-group"><label>部門</label><input type="text" id="edit-department"></div>
      <div class="form-group"><label>役職</label><input type="text" id="edit-title"></div>
      <div class="form-group"><label>携帯電話1</label><input type="tel" id="edit-mobile1"></div>
      <div class="form-group"><label>携帯電話2</label><input type="tel" id="edit-mobile2"></div>
      <div class="form-group"><label>電話番号</label><input type="tel" id="edit-phone"></div>
      <div class="form-group"><label>FAX</label><input type="tel" id="edit-fax"></div>
      <div class="form-group"><label>メールアドレス1</label><input type="email" id="edit-email1"></div>
      <div class="form-group"><label>メールアドレス2</label><input type="email" id="edit-email2"></div>
      <div class="form-group"><label>住所</label><input type="text" id="edit-address"></div>
      <div class="form-group"><label>ウェブページ</label><input type="url" id="edit-website"></div>
      <div class="form-group"><label>メモ</label><input type="text" id="edit-memo"></div>
      <button id="btnSave" class="btn btn-save" type="button">この内容で登録する</button>
      <button id="btnCancel" class="btn btn-retry" type="button">キャンセル</button>
    </div>

    <div id="status" class="status">
      <h3 id="statusTitle">登録完了</h3>
      <p id="statusMsg"></p>
    </div>
  </div>

  <div id="tab-search" class="tab-content">
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="名前・会社名・ふりがなで検索...">
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <p style="margin-top:24px;font-size:0.85rem;color:#666;text-align:center;">
    <a href="token-generator.html" style="color:#6cb6ff;">トークン生成</a>
  </p>

  <div id="cropEditor" class="crop-editor" aria-hidden="true">
    <h2 id="cropTitle">切り取り</h2>
    <p class="crop-help" id="cropHelp"></p>
    <div class="crop-stage">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="crop-actions">
      <button id="btnCropApply" class="btn btn-save" type="button">この範囲で切り取る</button>
      <button id="btnCropCancel" class="btn btn-retry" type="button">キャンセル</button>
    </div>
  </div>

  <script src="secrets.js?v=20260920b"></script>
  <script src="app.js?v=20260920b"></script>
</body>
</html>
