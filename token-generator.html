<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トークン生成 — 名刺OCR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
      max-width: 560px;
      margin: 0 auto;
    }
    h1 { color: #e94560; font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; }
    label {
      display: block;
      color: #e94560;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .row { margin-bottom: 16px; }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #16213e;
      color: #e0e0e0;
      font-size: 1rem;
      font-family: ui-monospace, Consolas, monospace;
    }
    textarea { min-height: 220px; resize: vertical; line-height: 1.4; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #fff; }
    .hint {
      background: #16213e;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9rem;
      color: #bbb;
      line-height: 1.6;
      margin-top: 8px;
    }
    .hint strong { color: #e0e0e0; }
    .ok { color: #2ecc71; font-size: 0.9rem; margin-top: 6px; display: none; }
    a { color: #6cb6ff; }
  </style>
</head>
<body>
  <h1>APIトークン生成</h1>
  <p>
    GAS（Script Properties）と PWA の<strong>接続設定</strong>に入れる
    API トークン用文字列を作ります。リポジトリには載せません。
  </p>

  <div class="row">
    <label for="length">文字数</label>
    <input type="number" id="length" value="40" min="16" max="128">
  </div>

  <button type="button" class="btn btn-primary" id="btnGenerate">トークンを生成</button>

  <div class="row">
    <label for="token">生成されたトークン</label>
    <input type="text" id="token" readonly>
    <button type="button" class="btn btn-secondary" id="btnCopyToken">トークンをコピー</button>
    <div class="ok" id="copiedToken">コピーしました</div>
  </div>

  <div class="row">
    <label for="gasUrl">GASデプロイURL（任意・メモ用）</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/...../exec">
  </div>

  <div class="row">
    <label for="secretsOut">接続設定メモ（任意）</label>
    <textarea id="secretsOut" readonly></textarea>
    <button type="button" class="btn btn-secondary" id="btnCopySecrets">メモをコピー</button>
    <div class="ok" id="copiedSecrets">コピーしました</div>
  </div>

  <div class="hint">
    <strong>使い方</strong><br>
    1. 「トークンを生成」→ トークンをコピー<br>
    2. Apps Script で <code>setupMeishiOcr</code> を実行したログのトークンと一致させる（または Properties の API_TOKEN を手動設定）<br>
    3. GAS を保存 → ウェブアプリを<strong>再デプロイ</strong><br>
    4. <a href="index.html">名刺OCR</a> の<strong>接続設定</strong>にデプロイ URL とトークンを貼って保存<br><br>
    ※ このページはブラウザ内だけで動作します。
  </div>

  <script>
    function generateToken(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      let out = '';
      for (let i = 0; i < length; i++) {
        out += chars[bytes[i] % chars.length];
      }
      return out;
    }

    function escapeJs(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function refreshSecrets() {
      const token = document.getElementById('token').value || 'YOUR_API_TOKEN';
      const gasUrl = document.getElementById('gasUrl').value.trim() || 'https://script.google.com/macros/s/XXXX/exec';
      document.getElementById('secretsOut').value =
`名刺OCR 接続設定メモ
GAS URL: ${gasUrl}
API_TOKEN: ${token}

→ index.html の「接続設定」に上記を貼り付けて保存してください。
→ GAS 側は setupMeishiOcr 実行後の Properties と一致させてください。
`;
    }

    function showOk(id) {
      const el = document.getElementById(id);
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 1500);
    }

    async function copyText(text, okId) {
      await navigator.clipboard.writeText(text);
      showOk(okId);
    }

    document.getElementById('btnGenerate').addEventListener('click', () => {
      let length = Number(document.getElementById('length').value) || 40;
      length = Math.min(128, Math.max(16, length));
      document.getElementById('length').value = length;
      document.getElementById('token').value = generateToken(length);
      refreshSecrets();
    });

    document.getElementById('gasUrl').addEventListener('input', refreshSecrets);

    document.getElementById('btnCopyToken').addEventListener('click', () => {
      const token = document.getElementById('token').value;
      if (!token) return;
      copyText(token, 'copiedToken');
    });

    document.getElementById('btnCopySecrets').addEventListener('click', () => {
      refreshSecrets();
      copyText(document.getElementById('secretsOut').value, 'copiedSecrets');
    });

    // 初期生成
    document.getElementById('btnGenerate').click();
  </script>
</body>
</html>
